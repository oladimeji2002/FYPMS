<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Registration - FYPMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            border-radius: 14px;
            background: #2563eb;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: #64748b;
            font-size: 13px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .role-badge {
            text-align: center;
            margin-bottom: 22px;
        }

        .role-badge span {
            display: inline-block;
            padding: 7px 14px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .register-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">F</div>

    <h1>Supervisor Registration</h1>

    <p class="subtitle">
        Create your supervisor account on the Final Year Project Management System
    </p>

    <div class="role-badge">
        <span>Supervisor Account</span>
    </div>

    <div id="message" class="message"></div>

    <form id="supervisorRegisterForm">

        <!-- Full Name -->
        <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Institutional Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your institutional email"
                required
            >
        </div>

        <!-- Phone -->
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >
        </div>

        <!-- Department -->
        <div class="form-group">
            <label for="department">Department</label>
            <input
                type="text"
                id="department"
                name="department"
                placeholder="Enter your department"
                required
            >
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('password', this)"
                >
                    Show
                </button>
            </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('confirm_password', this)"
                >
                    Show
                </button>
            </div>
        </div>

        <button
            type="submit"
            class="btn"
            id="registerBtn"
        >
            Create Supervisor Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="index.html">Login here</a>
    </div>

</div>


<script>

const API_URL = "api/auth/register.php";

const form = document.getElementById("supervisorRegisterForm");
const messageBox = document.getElementById("message");
const registerBtn = document.getElementById("registerBtn");


function showMessage(message, type) {
    messageBox.textContent = message;
    messageBox.className = "message " + type;
}


function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        button.textContent = "Hide";
    } else {
        input.type = "password";
        button.textContent = "Show";
    }
}


form.addEventListener("submit", async function (e) {

    e.preventDefault();

    const fullname = document.getElementById("fullname").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const department = document.getElementById("department").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm_password").value;

    // Validation
    if (!fullname || !email || !phone || !department || !password || !confirmPassword) {
        showMessage("Please fill in all fields.", "error");
        return;
    }

    if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", "error");
        return;
    }

    if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
    }

    registerBtn.disabled = true;
    registerBtn.textContent = "Creating Account...";

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",

            body: JSON.stringify({
                role: "supervisor",
                fullname: fullname,
                email: email,
                phone: phone,
                department: department,
                password: password,
                confirm_password: confirmPassword
            })
        });

        const data = await response.json();

        if (data.success) {

            showMessage(
                data.message || "Supervisor account created successfully.",
                "success"
            );

            form.reset();

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);

        } else {

            showMessage(
                data.message || "Registration failed. Please try again.",
                "error"
            );
        }

    } catch (error) {

        console.error("Registration error:", error);

        showMessage(
            "Unable to connect to the server. Please try again.",
            "error"
        );

    } finally {

        registerBtn.disabled = false;
        registerBtn.textContent = "Create Supervisor Account";
    }

});

</script>

</body>
</html>
